# nginx: reverse-proxy everything under /ai/ to Muscovado
# (auth happens in the app; nginx is only the entry point)
#
# Change two things before deploying:
#   - the port in proxy_pass -> your frp mapping port (59120 in the example below)
#   - without frp, just use proxy_pass http://127.0.0.1:9120/;
#
# Must go inside a server {} block. The same file also needs these
# (in the http {} context):
#   limit_req_zone  $binary_remote_addr zone=muscovado:10m rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=muscovado_conn:10m;

location = /ai {
    return 301 /ai/;
}

# ^~ is required: a common `location ~* \.(css|js)$` regex block in the same
# server would steal /ai/app.css, causing 404s on static assets or serving
# them from the wrong root.
location ^~ /ai/ {
    proxy_pass http://127.0.0.1:59120/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Three settings that matter for streaming chat (NDJSON):
    #   proxy_buffering off  -- do not buffer in nginx; forward chunk by chunk
    #   proxy_read_timeout   -- long answers can take several minutes
    #   client_max_body_size -- voice uploads audio; the default 1m holds only a few seconds
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    limit_req  zone=muscovado burst=12 nodelay;
    limit_conn muscovado_conn 20;

    client_max_body_size 10m;
}
